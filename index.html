<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-RSS Netflix Ticker for TV</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-width: 200px;
            --card-height: 120px;
            --speed: 145s;
            --breaking-speed: 80s;
            --font-size: 11px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0 0 80px 0;
            overflow-y: auto;
            min-height: 100vh;
        }

        /* Focus Engine Highlight for D-Pad / TV Remotes / Laptop Keyboard */
        .tv-focusable:focus,
        .tv-focusable.tv-focused {
            outline: none !important;
            border: 3px solid #e50914 !important;
            transform: scale(1.06) !important;
            z-index: 500 !important;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.8) !important;
        }

        /* Hamburger Button */
        #menu-button {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 1100;
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border: 0;
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.96);
            box-shadow: 0 3px 12px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        #menu-button span {
            display: block;
            width: 25px;
            height: 3px;
            border-radius: 2px;
            background: #fff;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        #menu-button[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        #menu-button[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
        }
        #menu-button[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Settings Panel */
        #settings {
            position: fixed;
            top: 72px;
            right: 20px;
            z-index: 1050;
            display: none;
            flex-direction: column;
            gap: 20px;
            width: min(360px, calc(100vw - 30px));
            max-height: calc(100vh - 90px);
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.98);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7);
        }

        #settings.open { display: flex; }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-section h2 {
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            font-size: 15px;
            font-weight: 600;
        }

        .setting {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting.hidden-setting {
            display: none !important;
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #ddd;
        }

        .setting-value {
            color: #e50914;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #e50914;
            cursor: pointer;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #eee;
            cursor: pointer;
        }

        .checkbox-option input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #e50914;
            cursor: pointer;
        }

        #feed-options, #breaking-feed-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- COMPACT BANNER (FULL WIDTH) --- */
        #hero-billboard {
            position: relative;
            width: 100%;
            height: 42vh;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-size: cover;
            background-position: center;
            padding: 30px 4%;
            margin-bottom: 35px;
            box-shadow: inset 0 -120px 80px -20px #141414;
            transition: background-image 0.8s ease-in-out;
        }

        body.hide-hero #hero-billboard {
            display: none !important;
        }

        #hero-billboard::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, #141414 0%, rgba(20,20,20,0.5) 60%, rgba(20,20,20,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
            margin-bottom: 12px;
        }

        .hero-content.fade-out {
            opacity: 0;
        }

        .hero-badge {
            background-color: #e50914;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-title {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 800;
            line-height: 1.15;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-desc {
            font-size: 1rem;
            color: #ccc;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .hero-footer-bar {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
        }

        .hero-btn {
            background: white;
            color: black;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            border: none;
            cursor: pointer;
        }

        .hero-btn:hover {
            background: rgba(255,255,255,0.8);
        }

        .hero-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .hero-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: none;
            cursor: pointer;
            padding: 0;
            transition: background 0.3s, transform 0.3s;
        }

        .hero-dot.active {
            background: #e50914;
            transform: scale(1.3);
        }

        /* --- IMMERSIVE READING MODAL (QUICK VIEW) --- */
        #article-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #article-modal.open {
            display: flex;
        }

        .modal-card {
            background: #181818;
            width: min(750px, 100%);
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .modal-header-img {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: #e50914;
        }

        .modal-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-meta {
            font-size: 12px;
            color: #8c8c8c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-title {
            font-size: 1.8rem;
            margin: 0;
            font-weight: bold;
            line-height: 1.2;
        }

        .modal-desc {
            font-size: 1rem;
            color: #ccc;
            line-height: 1.6;
            margin: 0;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        /* --- BREAKING NEWS TICKER INFERIOR --- */
        #breaking-ticker {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid #e50914;
            display: flex;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
        }

        body.hide-breaking #breaking-ticker {
            display: none !important;
        }

        .breaking-label {
            background-color: #e50914;
            color: white;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 2;
        }

        .breaking-wrap {
            display: flex;
            width: max-content;
            animation: breaking-scroll var(--breaking-speed) linear infinite;
        }

        .breaking-wrap:hover {
            animation-play-state: paused;
        }

        .breaking-item {
            display: inline-flex;
            align-items: center;
            padding: 0 30px;
            font-size: 13px;
            color: #eee;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }

        .breaking-item:hover {
            color: #e50914;
            text-decoration: underline;
        }

        .breaking-item span.source {
            color: #8c8c8c;
            margin-right: 8px;
            font-weight: bold;
        }

        @keyframes breaking-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Main Container */
        #feeds-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .feed-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .feed-row[hidden] { display: none; }

        .feed-title {
            padding-left: 4%;
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            font-weight: 500;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .feed-update-date {
            font-size: 0.9rem;
            color: #8c8c8c;
            font-weight: 400;
        }

        /* --- TICKER VS GRID MODE --- */
        .ticker-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: linear-gradient(
                90deg,
                rgba(20,20,20,1) 0%,
                rgba(20,20,20,0) 5%,
                rgba(20,20,20,0) 95%,
                rgba(20,20,20,1) 100%
            );
        }

        .ticker-wrap {
            display: flex;
            width: max-content;
            animation: scroll var(--speed) linear infinite;
        }

        .ticker-wrap:hover { animation-play-state: paused; }

        body.grid-mode .ticker-container {
            overflow: visible;
            background: none;
            padding: 0 4%;
        }

        body.grid-mode .ticker-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            width: 100%;
            animation: none;
            gap: 20px;
        }

        body.grid-mode .ticker-wrap .feed-card.duplicate-card {
            display: none !important;
        }

        .feed-card {
            display: block;
            width: var(--card-width);
            height: var(--card-height);
            flex-shrink: 0;
            margin-right: 15px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-decoration: none;
            color: white;
            padding-left: 55px;
            transition: padding-left 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
        }

        body.grid-mode .feed-card {
            width: 100% !important;
            height: calc(var(--card-height) * 1.3);
            margin-right: 0;
        }

        body.hide-ranks .feed-card {
            padding-left: 10px;
        }

        .feed-card::before {
            content: attr(data-rank);
            position: absolute;
            left: -10px;
            bottom: -15px;
            font-size: 110px;
            font-weight: 900;
            font-family: 'Impact', sans-serif;
            color: #e50914;
            -webkit-text-stroke: 3px #000000;
            text-shadow: 3px 3px 0px #000;
            z-index: 2;
            pointer-events: none;
            line-height: 1;
            transition: opacity 0.3s ease;
        }

        body.hide-ranks .feed-card::before {
            opacity: 0;
            pointer-events: none;
        }

        .feed-card:hover {
            transform: scale(1.12);
            z-index: 100;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
        }

        .feed-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.95) 0%,
                rgba(0,0,0,0.6) 60%,
                rgba(0,0,0,0) 100%
            );
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 70%;
            z-index: 3;
        }

        .feed-card h3 {
            margin: 0;
            font-size: var(--font-size);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .trend-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(229, 9, 20, 0.9);
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            z-index: 4;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @media (max-width: 650px) {
            #menu-button { top: 10px; right: 10px; }
            #settings {
                top: 68px;
                right: 10px;
                width: calc(100vw - 20px);
            }
            .hero-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Hamburger Button -->
    <button
        id="menu-button"
        type="button"
        class="tv-focusable"
        aria-label="Open settings"
        aria-controls="settings"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Settings Panel -->
    <aside id="settings" aria-label="Settings">

        <section class="settings-section">
            <h2>Presentation</h2>

            <div class="setting">
                <div class="setting-header">
                    <label for="speedSlider">Ticker Speed</label>
                    <span class="setting-value" id="speedValue">145 s</span>
                </div>
                <input type="range" id="speedSlider" class="tv-focusable" min="20" max="200" step="5" value="145">
            </div>

            <div class="setting" id="breakingSpeedSetting">
                <div class="setting-header">
                    <label for="breakingSpeedSlider">Breaking News Speed</label>
                    <span class="setting-value" id="breakingSpeedValue">80 s</span>
                </div>
                <input type="range" id="breakingSpeedSlider" class="tv-focusable" min="20" max="150" step="5" value="80">
            </div>

            <div class="setting">
                <div class="setting-header">
                    <label for="sizeSlider">Card Size</label>
                    <span class="setting-value" id="sizeValue">200 px</span>
                </div>
                <input type="range" id="sizeSlider" class="tv-focusable" min="200" max="500" step="10" value="200">
            </div>

            <div class="setting">
                <div class="setting-header">
                    <label for="fontSlider">Font Size</label>
                    <span class="setting-value" id="fontValue">11 px</span>
                </div>
                <input type="range" id="fontSlider" class="tv-focusable" min="10" max="24" step="1" value="11">
            </div>

            <div class="setting">
                <label class="checkbox-option">
                    <input type="checkbox" id="heroToggle" class="tv-focusable" checked>
                    <span>Show Compact Header Banner</span>
                </label>
            </div>

            <div class="setting">
                <label class="checkbox-option">
                    <input type="checkbox" id="gridToggle" class="tv-focusable">
                    <span>TV Grid Mode</span>
                </label>
            </div>

            <div class="setting">
                <label class="checkbox-option">
                    <input type="checkbox" id="rankToggle" class="tv-focusable" checked>
                    <span>Show Top 10 Ranking Numbers</span>
                </label>
            </div>

            <div class="setting">
                <label class="checkbox-option">
                    <input type="checkbox" id="autoplayToggle" class="tv-focusable">
                    <span>Lean-Back Auto-Play Mode</span>
                </label>
            </div>

            <div class="setting">
                <label class="checkbox-option">
                    <input type="checkbox" id="breakingToggle" class="tv-focusable" checked>
                    <span>Show Breaking News Ticker</span>
                </label>
            </div>
        </section>

        <section class="settings-section">
            <h2>RSS Feeds</h2>
            <div id="feed-options"></div>
        </section>

        <section class="settings-section" id="breakingFeedsSection">
            <h2>Breaking News Feeds</h2>
            <div id="breaking-feed-options"></div>
        </section>

    </aside>

    <!-- Compact Billboard Header (Full Width) -->
    <div id="hero-billboard" style="display: none;">
        <div class="hero-content" id="heroContent">
            <span class="hero-badge" id="heroBadge">Trending</span>
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <p class="hero-desc" id="heroDesc"></p>
        </div>
        <div class="hero-footer-bar">
            <div class="hero-buttons">
                <button class="hero-btn tv-focusable" id="heroReadBtn">▶ Quick View</button>
                <a href="#" class="hero-btn tv-focusable" id="heroLink" target="_blank" rel="noopener noreferrer" style="background: rgba(109, 109, 110, 0.7); color: white;">External ↗</a>
            </div>
            <div class="hero-dots" id="heroDotsContainer"></div>
        </div>
    </div>

    <!-- Immersive Reading Modal (Quick View) -->
    <div id="article-modal">
        <div class="modal-card">
            <div class="modal-header-img" id="modalImg">
                <button class="modal-close-btn tv-focusable" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <span class="modal-meta" id="modalMeta">Source • Date</span>
                <h2 class="modal-title" id="modalTitle">Article Title</h2>
                <p class="modal-desc" id="modalDesc">Full article summary description goes here...</p>
                <div class="modal-actions">
                    <a href="#" class="hero-btn tv-focusable" id="modalExternalLink" target="_blank" rel="noopener noreferrer">Open Full Article ↗</a>
                </div>
            </div>
        </div>
    </div>

    <div id="feeds-container"></div>

    <!-- Breaking News Ticker Bar -->
    <div id="breaking-ticker">
        <div class="breaking-label">Breaking News</div>
        <div style="overflow: hidden; width: 100%; position: relative;">
            <div class="breaking-wrap" id="breakingWrap"></div>
        </div>
    </div>

    <script>
        const RSS_FEEDS = [
            {
                id: 'io9',
                name: 'io9',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fgizmodo.com%2Fio9%2Ffeed'
            },
            {
                id: 'wired',
                name: 'WIRED',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.wired.com%2Ffeed%2Frss'
            },
            {
                id: 'boingboing',
                name: 'Boing Boing',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fboingboing.net%2Ffeed'
            },
            {
                id: 'polygon',
                name: 'Polygon',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.polygon.com%2Ffeed'
            },
            {
                id: 'quanta',
                name: 'Quanta Magazine',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.quantamagazine.org%2Ffeed%2F'
            },
            {
                id: 'hackernews',
                name: 'Hacker News',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fhnrss.org%2Fbest'
            }
        ];

        const BREAKING_FEEDS = [
            {
                id: 'elmundo',
                name: 'El Mundo',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.elmundo.es%2Frss%2Fgooglenews%2Fportada.xml'
            },
            {
                id: 'elpais',
                name: 'El País',
                url: 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.elpais.com%2Fmrss-s%2Fpages%2Fep%2Fsite%2Felpais.com%2Fportada'
            }
        ];

        const DEFAULT_IMAGE = 'https://unsplash.com';
        const enabledFeeds = Object.fromEntries(RSS_FEEDS.map(feed => [feed.id, true]));
        const enabledBreakingFeeds = Object.fromEntries(BREAKING_FEEDS.map(feed => [feed.id, true]));
        const feedRows = new Map();
        
        let allFeedsData = new Map();
        let breakingFeedsData = new Map();
        let heroItemsPool = [];
        let heroInterval = null;
        let currentHeroIndex = 0;
        let autoplayInterval = null;

        // --- MOTOR DE ENFOQUE MEJORADO (SPATIAL NAVIGATION PARA TV Y PORTÁTIL) ---
        function getFocusableElements() {
            const focusables = Array.from(document.querySelectorAll('.tv-focusable, .feed-card, .hero-dot, .breaking-item'));
            return focusables.filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && window.getComputedStyle(el).display !== 'none' && !el.disabled;
            });
        }

        let currentFocusIndex = 0;

        function updateFocus(index) {
            const focusables = getFocusableElements();
            if (focusables.length === 0) return;
            
            if (index < 0) index = focusables.length - 1;
            if (index >= focusables.length) index = 0;
            
            currentFocusIndex = index;
            const targetEl = focusables[currentFocusIndex];
            
            targetEl.focus();
            targetEl.classList.add('tv-focused');

            focusables.forEach((el, idx) => {
                if (idx !== currentFocusIndex) el.classList.remove('tv-focused');
            });

            // Asegurar scroll suave automático hacia el elemento enfocado si está fuera de vista
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }

        // Navegación espacial basada en coordenadas para ordenador / D-Pad
        function findClosestElement(direction) {
            const focusables = getFocusableElements();
            const currentEl = document.activeElement;
            let currentIndex = focusables.indexOf(currentEl);
            
            if (currentIndex === -1) return currentFocusIndex;

            const currentRect = currentEl.getBoundingClientRect();
            let closestIndex = currentIndex;
            let minDistance = Infinity;

            focusables.forEach((el, idx) => {
                if (idx === currentIndex) return;
                const rect = el.getBoundingClientRect();
                let isValidDirection = false;
                let distance = Infinity;

                if (direction === 'ArrowRight' && rect.left >= currentRect.right - 20) {
                    isValidDirection = true;
                    distance = Math.abs(rect.top - currentRect.top) * 1.5 + Math.abs(rect.left - currentRect.right);
                } else if (direction === 'ArrowLeft' && rect.right <= currentRect.left + 20) {
                    isValidDirection = true;
                    distance = Math.abs(rect.top - currentRect.top) * 1.5 + Math.abs(currentRect.left - rect.right);
                } else if (direction === 'ArrowDown' && rect.top >= currentRect.bottom - 20) {
                    isValidDirection = true;
                    distance = Math.abs(rect.left - currentRect.left) * 1.5 + Math.abs(rect.top - currentRect.bottom);
                } else if (direction === 'ArrowUp' && rect.bottom <= currentRect.top + 20) {
                    isValidDirection = true;
                    distance = Math.abs(rect.left - currentRect.left) * 1.5 + Math.abs(currentRect.top - rect.bottom);
                }

                if (isValidDirection && distance < minDistance) {
                    minDistance = distance;
                    closestIndex = idx;
                }
            });

            return closestIndex;
        }

        window.addEventListener('keydown', (e) => {
            const focusables = getFocusableElements();
            if (focusables.length === 0) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
                e.preventDefault(); // Bloquea el comportamiento por defecto del scroll de la página en el portátil

                if (e.key === 'Enter') {
                    if (document.activeElement && typeof document.activeElement.click === 'function') {
                        document.activeElement.click();
                    }
                } else {
                    const nextIndex = findClosestElement(e.key);
                    updateFocus(nextIndex);
                }
            }
        });

        const menuButton = document.getElementById('menu-button');
        const settings = document.getElementById('settings');
        let settingsTimeout = null;

        function closeSettings() {
            settings.classList.remove('open');
            menuButton.setAttribute('aria-expanded', 'false');
            menuButton.setAttribute('aria-label', 'Open settings');
            clearTimeout(settingsTimeout);
        }

        function openSettings() {
            settings.classList.add('open');
            menuButton.setAttribute('aria-expanded', 'true');
            menuButton.setAttribute('aria-label', 'Close settings');
            resetSettingsInactivityTimer();
        }

        function resetSettingsInactivityTimer() {
            clearTimeout(settingsTimeout);
            settingsTimeout = setTimeout(() => {
                if (settings.classList.contains('open')) closeSettings();
            }, 5000);
        }

        menuButton.addEventListener('click', (e) => {
            e.stopPropagation();
            if (settings.classList.contains('open')) closeSettings();
            else openSettings();
        });

        settings.addEventListener('mousemove', resetSettingsInactivityTimer);
        settings.addEventListener('click', resetSettingsInactivityTimer);
        settings.addEventListener('keydown', resetSettingsInactivityTimer);

        const articleModal = document.getElementById('article-modal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function openModal(itemData) {
            document.getElementById('modalImg').style.backgroundImage = `url("${itemData.image}")`;
            document.getElementById('modalMeta').textContent = `${itemData.feedName} • ${itemData.dateStr || ''}`;
            document.getElementById('modalTitle').textContent = itemData.title;
            document.getElementById('modalDesc').textContent = itemData.description || 'No detailed description available.';
            document.getElementById('modalExternalLink').href = itemData.link;
            articleModal.classList.add('open');
            modalCloseBtn.focus();
        }

        function closeModal() {
            articleModal.classList.remove('open');
            menuButton.focus();
        }

        modalCloseBtn.addEventListener('click', closeModal);
        articleModal.addEventListener('click', (e) => {
            if (e.target === articleModal) closeModal();
        });

        const speedSlider = document.getElementById('speedSlider');
        const breakingSpeedSetting = document.getElementById('breakingSpeedSetting');
        const breakingSpeedSlider = document.getElementById('breakingSpeedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const fontSlider = document.getElementById('fontSlider');
        const rankToggle = document.getElementById('rankToggle');
        const heroToggle = document.getElementById('heroToggle');
        const gridToggle = document.getElementById('gridToggle');
        const autoplayToggle = document.getElementById('autoplayToggle');
        const breakingToggle = document.getElementById('breakingToggle');
        const breakingFeedsSection = document.getElementById('breakingFeedsSection');

        const speedValue = document.getElementById('speedValue');
        const breakingSpeedValue = document.getElementById('breakingSpeedValue');
        const sizeValue = document.getElementById('sizeValue');
        const fontValue = document.getElementById('fontValue');

        speedSlider.addEventListener('input', () => {
            const speed = speedSlider.value;
            document.documentElement.style.setProperty('--speed', speed + 's');
            speedValue.textContent = speed + ' s';
        });

        breakingSpeedSlider.addEventListener('input', () => {
            const bSpeed = breakingSpeedSlider.value;
            document.documentElement.style.setProperty('--breaking-speed', bSpeed + 's');
            breakingSpeedValue.textContent = bSpeed + ' s';
        });

        sizeSlider.addEventListener('input', () => {
            const width = Number(sizeSlider.value);
            const height = Math.round(width * 0.6);
            document.documentElement.style.setProperty('--card-width', width + 'px');
            document.documentElement.style.setProperty('--card-height', height + 'px');
            sizeValue.textContent = width + ' px';
        });

        fontSlider.addEventListener('input', () => {
            const fontSize = Number(fontSlider.value);
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            fontValue.textContent = fontSize + ' px';
        });

        rankToggle.addEventListener('change', () => document.body.classList.toggle('hide-ranks', !rankToggle.checked));
        heroToggle.addEventListener('change', () => document.body.classList.toggle('hide-hero', !heroToggle.checked));
        gridToggle.addEventListener('change', () => document.body.classList.toggle('grid-mode', gridToggle.checked));

        breakingToggle.addEventListener('change', () => {
            const isHidden = !breakingToggle.checked;
            document.body.classList.toggle('hide-breaking', isHidden);
            breakingSpeedSetting.classList.toggle('hidden-setting', isHidden);
            breakingFeedsSection.style.display = isHidden ? 'none' : 'flex';
        });

        autoplayToggle.addEventListener('change', () => {
            if (autoplayToggle.checked) startAutoplayScroll();
            else stopAutoplayScroll();
        });

        function startAutoplayScroll() {
            if (autoplayInterval) clearInterval(autoplayInterval);
            autoplayInterval = setInterval(() => {
                window.scrollBy({ top: window.innerHeight * 0.75, behavior: 'smooth' });
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, 8000);
        }

        function stopAutoplayScroll() {
            if (autoplayInterval) clearInterval(autoplayInterval);
        }

        function createFeedOptions() {
            const optionsContainer = document.getElementById('feed-options');
            optionsContainer.innerHTML = '';

            RSS_FEEDS.forEach(feed => {
                const label = document.createElement('label');
                label.className = 'checkbox-option';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'tv-focusable';
                checkbox.checked = true;
                checkbox.dataset.feedId = feed.id;

                checkbox.addEventListener('change', () => {
                    enabledFeeds[feed.id] = checkbox.checked;
                    const row = feedRows.get(feed.id);
                    if (row) row.hidden = !checkbox.checked;
                    rebuildHeroPool();
                });

                const name = document.createElement('span');
                name.textContent = feed.name;
                label.appendChild(checkbox);
                label.appendChild(name);
                optionsContainer.appendChild(label);
            });

            const breakingContainer = document.getElementById('breaking-feed-options');
            breakingContainer.innerHTML = '';

            BREAKING_FEEDS.forEach(feed => {
                const label = document.createElement('label');
                label.className = 'checkbox-option';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'tv-focusable';
                checkbox.checked = true;
                checkbox.dataset.breakingId = feed.id;

                checkbox.addEventListener('change', () => {
                    enabledBreakingFeeds[feed.id] = checkbox.checked;
                    loadBreakingFeeds();
                });

                const name = document.createElement('span');
                name.textContent = feed.name;
                label.appendChild(checkbox);
                label.appendChild(name);
                breakingContainer.appendChild(label);
            });
        }

        async function fetchFeedData(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            if (data.status !== 'ok') throw new Error('Error parsing RSS');
            return data;
        }

        function formatFeedDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return '';
                const d = date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const t = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: false });
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop() || '';
                return `(Updated: ${d}, ${t} ${tz})`;
            } catch (e) { return ''; }
        }

        function formatArticleDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return '';
                const d = date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const t = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: false });
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop() || '';
                return `${d}, ${t} ${tz}`;
            } catch (e) { return ''; }
        }

        function isTrending(dateString) {
            if (!dateString) return false;
            try {
                const diff = (new Date() - new Date(dateString)) / (1000 * 60 * 60);
                return diff >= 0 && diff <= 2;
            } catch (e) { return false; }
        }

        function extractImage(item) {
            let imageUrl = item.thumbnail || (item.enclosure && item.enclosure.link) || DEFAULT_IMAGE;
            if (imageUrl === DEFAULT_IMAGE && item.description) {
                const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                if (imgMatch && imgMatch[1]) imageUrl = imgMatch[1];
            }
            return imageUrl;
        }

        function rebuildHeroPool() {
            heroItemsPool = [];
            const activeFeeds = RSS_FEEDS.filter(feed => enabledFeeds[feed.id] && allFeedsData.has(feed.id));
            
            if (activeFeeds.length === 0) {
                document.getElementById('hero-billboard').style.display = 'none';
                return;
            }

            let maxItems = 0;
            activeFeeds.forEach(feed => {
                const items = allFeedsData.get(feed.id);
                if (items && items.length > maxItems) maxItems = items.length;
            });

            const limitPerFeed = Math.min(maxItems, 3);
            for (let i = 0; i < limitPerFeed; i++) {
                activeFeeds.forEach(feed => {
                    const items = allFeedsData.get(feed.id);
                    if (items && items[i]) {
                        const item = items[i];
                        heroItemsPool.push({
                            title: item.title || 'Untitled',
                            description: item.description ? item.description.replace(/<[^>]*>?/gm, '') : '',
                            link: item.link || '#',
                            image: extractImage(item),
                            feedName: feed.name,
                            rank: i + 1,
                            dateStr: formatArticleDate(item.pubDate)
                        });
                    }
                });
            }

            renderHeroDots();
            if (heroItemsPool.length > 0) {
                document.getElementById('hero-billboard').style.display = 'flex';
                currentHeroIndex = 0;
                updateHeroBillboard();
            } else {
                document.getElementById('hero-billboard').style.display = 'none';
            }
        }

        function renderHeroDots() {
            const dotsContainer = document.getElementById('heroDotsContainer');
            dotsContainer.innerHTML = '';
            heroItemsPool.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = `hero-dot tv-focusable ${index === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => {
                    currentHeroIndex = index;
                    updateHeroBillboard();
                    resetHeroTimer();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateHeroBillboard() {
            if (heroItemsPool.length === 0) return;
            if (currentHeroIndex >= heroItemsPool.length) currentHeroIndex = 0;

            const item = heroItemsPool[currentHeroIndex];
            const billboard = document.getElementById('hero-billboard');
            const contentEl = document.getElementById('heroContent');

            contentEl.classList.add('fade-out');

            setTimeout(() => {
                billboard.style.backgroundImage = `url("${item.image}")`;
                document.getElementById('heroBadge').textContent = `Trending #${item.rank} • ${item.feedName}`;
                document.getElementById('heroTitle').textContent = item.title;
                document.getElementById('heroDesc').textContent = item.description;
                document.getElementById('heroLink').href = item.link;
                
                const readBtn = document.getElementById('heroReadBtn');
                readBtn.onclick = () => openModal(item);

                const dots = document.querySelectorAll('.hero-dot');
                dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentHeroIndex));

                contentEl.classList.remove('fade-out');
            }, 250);
        }

        function nextHeroSlide() {
            if (heroItemsPool.length <= 1) return;
            currentHeroIndex = (currentHeroIndex + 1) % heroItemsPool.length;
            updateHeroBillboard();
        }

        function resetHeroTimer() {
            if (heroInterval) clearInterval(heroInterval);
            heroInterval = setInterval(nextHeroSlide, 6000);
        }

        async function loadBreakingFeeds() {
            const breakingWrap = document.getElementById('breakingWrap');
            breakingWrap.innerHTML = '';
            let breakingItems = [];

            for (const feed of BREAKING_FEEDS) {
                if (!enabledBreakingFeeds[feed.id]) continue;
                try {
                    const data = await fetchFeedData(feed.url);
                    if (data.items && data.items.length > 0) {
                        data.items.slice(0, 5).forEach(item => {
                            breakingItems.push({
                                title: item.title || 'Untitled',
                                link: item.link || '#',
                                feedName: feed.name,
                                image: extractImage(item),
                                description: item.description ? item.description.replace(/<[^>]*>?/gm, '') : '',
                                dateStr: formatArticleDate(item.pubDate)
                            });
                        });
                    }
                } catch (error) { console.error(error); }
            }

            for (let round = 0; round < 2; round++) {
                breakingItems.forEach(item => {
                    const a = document.createElement('a');
                    a.className = 'breaking-item tv-focusable';
                    a.href = '#';
                    a.innerHTML = `<span class="source">[${item.feedName}]</span> ${item.title}`;
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        openModal(item);
                    });
                    breakingWrap.appendChild(a);
                });
            }
        }

        async function loadFeed(feed) {
            const container = document.getElementById('feeds-container');
            try {
                const data = await fetchFeedData(feed.url);
                if (data.items && data.items.length > 0) allFeedsData.set(feed.id, data.items);

                const rowDiv = document.createElement('div');
                rowDiv.className = 'feed-row';
                rowDiv.hidden = !enabledFeeds[feed.id];

                const titleEl = document.createElement('h2');
                titleEl.className = 'feed-title';
                const titleText = document.createElement('span');
                titleText.textContent = data.feed.title || feed.name;
                titleEl.appendChild(titleText);

                const rawDate = (data.items && data.items.length > 0 && data.items[0].pubDate) || data.feed.pubDate;
                const formattedDate = formatFeedDate(rawDate);
                if (formattedDate) {
                    const dateSpan = document.createElement('span');
                    dateSpan.className = 'feed-update-date';
                    dateSpan.textContent = formattedDate;
                    titleEl.appendChild(dateSpan);
                }

                const tickerContainer = document.createElement('div');
                tickerContainer.className = 'ticker-container';
                const tickerWrap = document.createElement('div');
                tickerWrap.className = 'ticker-wrap';

                data.items.forEach((item, index) => {
                    const imageUrl = extractImage(item);
                    const cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : '';
                    const card = document.createElement('div');
                    card.className = 'feed-card tv-focusable';
                    card.style.backgroundImage = `url("${imageUrl}")`;
                    card.setAttribute('data-rank', index + 1);
                    
                    card.addEventListener('click', () => {
                        openModal({
                            title: item.title || 'Untitled',
                            description: cleanDesc,
                            link: item.link || '#',
                            image: imageUrl,
                            feedName: feed.name,
                            dateStr: formatArticleDate(item.pubDate)
                        });
                    });

                    if (isTrending(item.pubDate)) {
                        const trendBadge = document.createElement('div');
                        trendBadge.className = 'trend-badge';
                        trendBadge.innerHTML = '🔥 Top Trend';
                        card.appendChild(trendBadge);
                    }

                    const overlay = document.createElement('div');
                    overlay.className = 'feed-card-overlay';
                    const heading = document.createElement('h3');
                    heading.textContent = item.title || 'Untitled';
                    overlay.appendChild(heading);
                    card.appendChild(overlay);
                    tickerWrap.appendChild(card);
                });

                data.items.forEach((item, index) => {
                    const imageUrl = extractImage(item);
                    const cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : '';
                    const card = document.createElement('div');
                    card.className = 'feed-card duplicate-card tv-focusable';
                    card.style.backgroundImage = `url("${imageUrl}")`;
                    card.setAttribute('data-rank', index + 1);

                    card.addEventListener('click', () => {
                        openModal({
                            title: item.title || 'Untitled',
                            description: cleanDesc,
                            link: item.link || '#',
                            image: imageUrl,
                            feedName: feed.name,
                            dateStr: formatArticleDate(item.pubDate)
                        });
                    });

                    if (isTrending(item.pubDate)) {
                        const trendBadge = document.createElement('div');
                        trendBadge.className = 'trend-badge';
                        trendBadge.innerHTML = '🔥 Top Trend';
                        card.appendChild(trendBadge);
                    }

                    const overlay = document.createElement('div');
                    overlay.className = 'feed-card-overlay';
                    const heading = document.createElement('h3');
                    heading.textContent = item.title || 'Untitled';
                    overlay.appendChild(heading);
                    card.appendChild(overlay);
                    tickerWrap.appendChild(card);
                });

                tickerContainer.appendChild(tickerWrap);
                rowDiv.appendChild(titleEl);
                rowDiv.appendChild(tickerContainer);
                container.appendChild(rowDiv);
                feedRows.set(feed.id, rowDiv);

            } catch (error) {
                const errorRow = document.createElement('div');
                errorRow.className = 'feed-row';
                errorRow.hidden = !enabledFeeds[feed.id];
                errorRow.innerHTML = `<h2 class="feed-title" style="color:#e50914;">Error loading ${feed.name}</h2>`;
                container.appendChild(errorRow);
                feedRows.set(feed.id, errorRow);
            }
        }

        async function loadAllFeeds() {
            const container = document.getElementById('feeds-container');
            container.innerHTML = '';
            feedRows.clear();
            allFeedsData.clear();

            for (let i = 0; i < RSS_FEEDS.length; i++) {
                await loadFeed(RSS_FEEDS[i]);
            }

            rebuildHeroPool();
            loadBreakingFeeds();
            resetHeroTimer();
        }

        createFeedOptions();
        loadAllFeeds();
        setInterval(loadAllFeeds, 10 * 60 * 1000);
    </script>
</body>
