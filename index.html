
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>argaldo feeds</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-width: 200px;
            --card-height: 120px;
            --speed: 145s;
            --font-size: 11px;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 0;
            overflow-y: auto;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Panel de configuración */
        #settings {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 25px;
            align-items: center;
            background: rgba(20, 20, 20, 0.95);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.6);
        }

        .setting {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 150px;
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #ddd;
        }

        .setting-value {
            color: #e50914;
            font-weight: bold;
        }

        input[type="range"] {
            width: 150px;
            accent-color: #e50914;
            cursor: pointer;
        }

        /* Contenedor principal */
        #feeds-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .feed-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .feed-title {
            padding-left: 4%;
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            font-weight: 500;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .ticker-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: linear-gradient(
                90deg,
                rgba(20,20,20,1) 0%,
                rgba(20,20,20,0) 5%,
                rgba(20,20,20,0) 95%,
                rgba(20,20,20,1) 100%
            );
        }

        .ticker-wrap {
            display: flex;
            width: max-content;
            animation: scroll var(--speed) linear infinite;
        }

        .ticker-wrap:hover {
            animation-play-state: paused;
        }

        .feed-card {
            display: block;
            text-decoration: none;
            color: white;

            width: var(--card-width);
            height: var(--card-height);
            flex-shrink: 0;
            margin-right: 15px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .feed-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .feed-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.9) 0%,
                rgba(0,0,0,0.5) 60%,
                rgba(0,0,0,0) 100%
            );
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 60%;
            box-sizing: border-box;
        }

        .feed-card h3 {
            margin: 0;
            font-size: var(--font-size);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Adaptación a pantallas pequeñas */
        @media (max-width: 650px) {
            #settings {
                left: 10px;
                right: 10px;
                gap: 12px;
                justify-content: space-around;
                flex-wrap: wrap;
            }

            .setting {
                min-width: 0;
                flex: 1;
            }

            input[type="range"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Panel de configuración -->
    <div id="settings">

        <div class="setting">
            <div class="setting-header">
                <label for="speedSlider">Speed</label>
                <span class="setting-value" id="speedValue">145 s</span>
            </div>
            <input
                type="range"
                id="speedSlider"
                min="20"
                max="200"
                step="5"
                value="145"
            >
        </div>

        <div class="setting">
            <div class="setting-header">
                <label for="sizeSlider">Article Size</label>
                <span class="setting-value" id="sizeValue">200 px</span>
            </div>
            <input
                type="range"
                id="sizeSlider"
                min="200"
                max="500"
                step="10"
                value="200"
            >
        </div>

        <div class="setting">
            <div class="setting-header">
                <label for="fontSlider">Font Size</label>
                <span class="setting-value" id="fontValue">11 px</span>
            </div>
            <input
                type="range"
                id="fontSlider"
                min="10"
                max="24"
                step="1"
                value="11"
            >
        </div>

    </div>

    <div id="feeds-container"></div>

    <script>
        const RSS_FEEDS = [
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fgizmodo.com%2Fio9%2Ffeed',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.wired.com%2Ffeed%2Frss',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fboingboing.net%2Ffeed',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Frss.beehiiv.com%2Ffeeds%2FowMwaGYU36.xml',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.feedburner.com%2Fbrainpickings%2Frss',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.polygon.com%2Ffeed',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.quantamagazine.org%2Ffeed%2F',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Frss.slashdot.org%2FSlashdot%2FslashdotMain',
            'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fhnrss.org%2Fbest',
        ];

        const DEFAULT_IMAGE = 'https://unsplash.com';

        // Controles de configuración
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const fontSlider = document.getElementById('fontSlider');

        const speedValue = document.getElementById('speedValue');
        const sizeValue = document.getElementById('sizeValue');
        const fontValue = document.getElementById('fontValue');

        // Modificar velocidad
        speedSlider.addEventListener('input', () => {
            const speed = speedSlider.value;

            document.documentElement.style.setProperty(
                '--speed',
                speed + 's'
            );

            speedValue.textContent = speed + ' s';
        });

        // Modificar tamaño de las tarjetas
        sizeSlider.addEventListener('input', () => {
            const width = Number(sizeSlider.value);
            const height = Math.round(width * 0.6);

            document.documentElement.style.setProperty(
                '--card-width',
                width + 'px'
            );

            document.documentElement.style.setProperty(
                '--card-height',
                height + 'px'
            );

            sizeValue.textContent = width + ' px';
        });

        // Modificar tamaño de la fuente
        fontSlider.addEventListener('input', () => {
            const fontSize = Number(fontSlider.value);

            document.documentElement.style.setProperty(
                '--font-size',
                fontSize + 'px'
            );

            fontValue.textContent = fontSize + ' px';
        });

        async function fetchFeedData(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('Error de red');
            }

            const data = await response.json();

            if (data.status !== 'ok') {
                throw new Error('Error al parsear el RSS');
            }

            return data;
        }

        async function loadAllFeeds() {
            const container = document.getElementById('feeds-container');
            container.innerHTML = '';

            for (const url of RSS_FEEDS) {
                try {
                    const data = await fetchFeedData(url);

                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'feed-row';

                    const titleEl = document.createElement('h2');
                    titleEl.className = 'feed-title';
                    titleEl.innerText = data.feed.title || 'Feed de Noticias';

                    const tickerContainer = document.createElement('div');
                    tickerContainer.className = 'ticker-container';

                    const tickerWrap = document.createElement('div');
                    tickerWrap.className = 'ticker-wrap';

                    data.items.forEach(item => {
                        let imageUrl =
                            item.thumbnail ||
                            (item.enclosure && item.enclosure.link) ||
                            DEFAULT_IMAGE;

                        if (imageUrl === DEFAULT_IMAGE && item.description) {
                            const imgMatch = item.description.match(
                                /<img[^>]+src="([^">]+)"/
                            );

                            if (imgMatch && imgMatch[1]) {
                                imageUrl = imgMatch[1];
                            }
                        }

                        // La tarjeta es ahora un enlace HTML real
                        const card = document.createElement('a');
                        card.className = 'feed-card';
                        card.href = item.link;
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';
                        card.style.backgroundImage = `url("${imageUrl}")`;

                        const overlay = document.createElement('div');
                        overlay.className = 'feed-card-overlay';

                        const heading = document.createElement('h3');
                        heading.textContent = item.title;

                        overlay.appendChild(heading);
                        card.appendChild(overlay);

                        tickerWrap.appendChild(card);
                    });

                    // Duplicar tarjetas para el desplazamiento infinito.
                    // Al ser enlaces HTML, las copias conservan sus destinos.
                    const cardsHTML = tickerWrap.innerHTML;
                    tickerWrap.innerHTML = cardsHTML + cardsHTML;

                    tickerContainer.appendChild(tickerWrap);
                    rowDiv.appendChild(titleEl);
                    rowDiv.appendChild(tickerContainer);
                    container.appendChild(rowDiv);

                } catch (error) {
                    console.error(`Error cargando el feed (${url}):`, error);

                    const errorRow = document.createElement('div');
                    errorRow.className = 'feed-row';

                    errorRow.innerHTML =
                        `<h2 class="feed-title" style="color:#e50914;">
                            Error al cargar el feed
                        </h2>`;

                    container.appendChild(errorRow);
                }
            }
        }

        // Cargar al iniciar
        loadAllFeeds();

        // Actualizar feeds cada 10 minutos
        setInterval(loadAllFeeds, 10 * 60 * 1000);
    </script>
</body>
</html>
